<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Доход Врача</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0d9488">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --accent: #0d9488;
      --accent-light: #14b8a6;
      --text: #f1f5f9;
      --muted: #94a3b8;
      --danger: #ef4444;
      --success: #22c55e;
      --border: #334155;
    }
    [data-theme="light"] {
      --bg: #f8fafc;
      --card: #ffffff;
      --text: #0f172a;
      --muted: #64748b;
      --border: #e2e8f0;
    }
    [data-color="blue"] { --accent: #2563eb; --accent-light: #3b82f6; }
    [data-color="purple"] { --accent: #7c3aed; --accent-light: #8b5cf6; }
    [data-color="orange"] { --accent: #ea580c; --accent-light: #f97316; }
    [data-color="rose"] { --accent: #e11d48; --accent-light: #f43f5e; }
    [data-color="emerald"] { --accent: #059669; --accent-light: #10b981; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding-bottom: 80px;
      transition: background .2s, color .2s;
    }
    header {
      background: linear-gradient(135deg, var(--accent), color-mix(in srgb, var(--accent) 70%, black));
      padding: 16px 16px 12px;
      position: sticky;
      top: 0;
      z-index: 10;
      color: white;
    }
    header h1 { font-size: 1.4rem; font-weight: 700; }
    .header-info { display: flex; justify-content: space-between; align-items: flex-end; margin-top: 4px; }
    .header-remain { font-size: 0.85rem; opacity: 0.95; text-align: right; }
    .progress-wrap { margin-top: 10px; height: 6px; background: rgba(255,255,255,.25); border-radius: 3px; overflow: hidden; }
    .progress-bar { height: 100%; background: #22c55e; border-radius: 3px; transition: width .3s; }
    .tabs {
      display: flex;
      background: var(--card);
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 88px;
      z-index: 9;
      overflow-x: auto;
    }
    .tab {
      flex: 1;
      min-width: 70px;
      padding: 12px 8px;
      text-align: center;
      font-size: 0.8rem;
      cursor: pointer;
      color: var(--muted);
      border-bottom: 3px solid transparent;
      white-space: nowrap;
    }
    .tab.active {
      color: var(--accent-light);
      border-bottom-color: var(--accent);
      font-weight: 600;
    }
    .content { padding: 16px; }
    .card {
      background: var(--card);
      border-radius: 12px;
      padding: 14px;
      margin-bottom: 12px;
      border: 1px solid var(--border);
    }
    input, button, select, textarea {
      font: inherit;
      border-radius: 8px;
      border: none;
    }
    input[type="number"], input[type="text"], input[type="date"], textarea {
      background: color-mix(in srgb, var(--card) 80%, var(--bg));
      color: var(--text);
      padding: 10px 12px;
      width: 100%;
      margin-bottom: 8px;
      border: 1px solid var(--border);
    }
    button {
      background: var(--accent);
      color: white;
      padding: 10px 16px;
      cursor: pointer;
      font-weight: 600;
    }
    button:active { transform: scale(0.98); }
    button.secondary { background: #475569; }
    button.danger { background: var(--danger); }
    .service-row {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 10px;
      padding: 10px;
      background: color-mix(in srgb, var(--card) 70%, var(--bg));
      border-radius: 10px;
    }
    .service-info { flex: 1; min-width: 0; }
    .service-name { font-weight: 600; }
    .service-price { color: var(--muted); font-size: 0.85rem; }
    .qty-controls {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .qty-btn {
      width: 36px;
      height: 36px;
      padding: 0;
      font-size: 1.2rem;
      line-height: 1;
      border-radius: 8px;
      background: #475569;
    }
    .qty-input {
      width: 60px !important;
      text-align: center;
      margin: 0 !important;
      padding: 8px 4px !important;
    }
    .total-box {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: var(--card);
      padding: 10px 16px;
      border-top: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 1rem;
      font-weight: 700;
    }
    .total-box .amount { color: var(--success); }
    .total-box .net { color: var(--accent-light); font-size: 0.9rem; }
    .empty { text-align: center; color: var(--muted); padding: 40px 20px; }
    .history-item {
      display: flex;
      justify-content: space-between;
      padding: 12px 0;
      border-bottom: 1px solid var(--border);
      cursor: pointer;
    }
    .stat-card {
      text-align: center;
      padding: 16px;
    }
    .stat-card .value { font-size: 1.5rem; font-weight: 700; color: var(--accent-light); }
    .stat-card .label { color: var(--muted); font-size: 0.85rem; }
    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .small { font-size: 0.8rem; color: var(--muted); }
    .cal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }
    .cal-nav { background: #475569; padding: 6px 12px; font-size: 1.1rem; }
    .cal-month { font-weight: 600; }
    .cal-week {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      padding: 4px 0 8px;
      scrollbar-width: thin;
    }
    .cal-day {
      flex: 0 0 48px;
      text-align: center;
      padding: 8px 4px;
      border-radius: 10px;
      background: #475569;
      cursor: pointer;
      font-size: 0.8rem;
    }
    .cal-day.non-working { background: #1e293b; color: #64748b; }
    .cal-day.selected { background: var(--accent); color: white; }
    .cal-day.has-data { border: 2px solid var(--success); }
    .cal-day.working { background: #065f46; color: white; }
    .cal-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 4px;
      margin-top: 8px;
    }
    .cal-weekday { text-align: center; font-size: 0.75rem; color: var(--muted); padding: 4px 0; }
    .cal-grid .cal-day { flex: none; }
    .quick-nav { display: flex; gap: 8px; margin-bottom: 12px; }
    .chart-bar { height: 8px; background: var(--border); border-radius: 4px; margin: 4px 0; overflow: hidden; }
    .chart-fill { height: 100%; background: var(--accent); border-radius: 4px; }
  </style>
</head>
<body>
  <header>
    <h1>💰 Доход Врача</h1>
    <div class="header-info">
      <div class="small" id="today-label"></div>
      <div class="header-remain" id="remain-label"></div>
    </div>
    <div class="progress-wrap"><div class="progress-bar" id="month-progress" style="width:0%"></div></div>
  </header>

  <div class="tabs">
    <div class="tab active" data-tab="today">Сегодня</div>
    <div class="tab" data-tab="stats">Статистика</div>
    <div class="tab" data-tab="settings">Настройки</div>
  </div>

  <div class="content" id="app"></div>

  <div class="total-box" id="total-box" style="display:none;">
    <div>
      <div>Итого: <span class="amount" id="day-total">0 ₽</span></div>
      <div class="net" id="day-net">Твой доход: 0 ₽</div>
    </div>
  </div>

  <script>
    const STORAGE_KEY = 'dohod_vracha_v2';

    let state = {
      services: [],
      days: {},
      currentDate: new Date().toISOString().slice(0, 10),
      incomePercent: 100,
      targetMonthly: 0,
      workingDaysMarked: {},
      notes: {},
      theme: 'system',
      color: 'teal'
    };

    let calExpanded = false;
    let calViewMonth = new Date().getMonth();
    let calViewYear = new Date().getFullYear();
    let markMode = false;

    function load() {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (raw) {
        try {
          const data = JSON.parse(raw);
          Object.assign(state, data);
          if (!state.notes) state.notes = {};
          if (!state.theme) state.theme = 'system';
          if (!state.color) state.color = 'teal';
        } catch (e) {}
      }
      if (state.services.length === 0) {
        state.services = [
          { id: 1, name: 'Консультация', price: 2000, usage: 0 },
          { id: 2, name: 'УЗИ', price: 2500, usage: 0 },
          { id: 3, name: 'Манипуляция', price: 1500, usage: 0 }
        ];
      }
      applyTheme();
      save();
    }

    function save() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    }

    function applyTheme() {
      const root = document.documentElement;
      let theme = state.theme;
      if (theme === 'system') {
        theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      }
      root.setAttribute('data-theme', theme);
      root.setAttribute('data-color', state.color || 'teal');
    }

    function nextId() {
      return state.services.reduce((m, s) => Math.max(m, s.id), 0) + 1;
    }

    function getSortedServices() {
      return [...state.services].sort((a, b) => (b.usage || 0) - (a.usage || 0) || a.name.localeCompare(b.name));
    }

    function getDayData(date) {
      return state.days[date] || {};
    }

    function calcDayTotal(date) {
      const day = getDayData(date);
      return state.services.reduce((sum, s) => sum + (day[s.id] || 0) * s.price, 0);
    }

    function calcNet(amount) {
      return Math.round(amount * state.incomePercent / 100);
    }

    function getMonthGross(ym) {
      let total = 0;
      Object.keys(state.days).forEach(date => {
        if (date.startsWith(ym)) total += calcDayTotal(date);
      });
      return total;
    }

    function getMonthNet(ym) {
      return calcNet(getMonthGross(ym));
    }

    function getRemainingWorkingDays() {
      const today = new Date().toISOString().slice(0,10);
      const ym = today.slice(0,7);
      return Object.keys(state.workingDaysMarked).filter(d => d.startsWith(ym) && d >= today && state.workingDaysMarked[d]).length;
    }

    function getDailyTarget() {
      const today = new Date().toISOString().slice(0,10);
      const ym = today.slice(0,7);
      const monthNet = getMonthNet(ym);
      const remain = Math.max(0, state.targetMonthly - monthNet);
      const leftDays = getRemainingWorkingDays();
      return leftDays > 0 ? Math.round(remain / leftDays) : 0;
    }

    function updateHeader() {
      const d = new Date(state.currentDate + 'T00:00:00');
      document.getElementById('today-label').textContent = d.toLocaleDateString('ru-RU', { weekday: 'long', day: 'numeric', month: 'long' });

      const ym = new Date().toISOString().slice(0,7);
      const currentNet = getMonthNet(ym);
      const remain = Math.max(0, state.targetMonthly - currentNet);
      const remainEl = document.getElementById('remain-label');
      const progress = document.getElementById('month-progress');
      if (state.targetMonthly > 0) {
        const pct = Math.min(100, Math.round(currentNet / state.targetMonthly * 100));
        remainEl.textContent = `Осталось: ${remain.toLocaleString('ru')} ₽`;
        remainEl.style.color = remain > 0 ? '#fbbf24' : '#22c55e';
        progress.style.width = pct + '%';
      } else {
        remainEl.textContent = '';
        progress.style.width = '0%';
      }
    }

    function render() {
      const tab = document.querySelector('.tab.active').dataset.tab;
      const app = document.getElementById('app');
      document.getElementById('total-box').style.display = tab === 'today' ? 'flex' : 'none';

      if (tab === 'today') renderToday(app);
      else if (tab === 'stats') renderStats(app);
      else if (tab === 'settings') renderSettings(app);

      updateHeader();
    }

    function renderCalendar() {
      const selected = state.currentDate;
      const monthNames = ['Январь','Февраль','Март','Апрель','Май','Июнь','Июль','Август','Сентябрь','Октябрь','Ноябрь','Декабрь'];

      let html = `<div class="card">
        <div class="cal-header">
          <button type="button" class="cal-nav" id="cal-prev">‹</button>
          <div class="cal-month">${monthNames[calViewMonth]} ${calViewYear}</div>
          <button type="button" class="cal-nav" id="cal-next">›</button>
          <button type="button" class="cal-nav secondary" id="cal-toggle" style="margin-left:8px;">${calExpanded ? 'Свернуть' : 'Развернуть'}</button>
        </div>`;

      if (calExpanded) {
        const marked = Object.keys(state.workingDaysMarked).filter(d => d.startsWith(`${calViewYear}-${String(calViewMonth+1).padStart(2,'0')}`) && state.workingDaysMarked[d]).length;
        const left = getRemainingWorkingDays();
        html += `
          <div style="margin:10px 0;">
            <label class="small">Необходимый мой доход за месяц</label>
            <input type="number" id="target-input" value="${state.targetMonthly}" min="0" step="1000">
            <div class="small">Отмечено рабочих: <strong>${marked}</strong> · осталось рабочих: <strong>${left}</strong></div>
            <button type="button" id="mark-mode-btn" class="${markMode ? '' : 'secondary'}" style="margin-top:8px; width:100%;">
              ${markMode ? 'Режим отметки включён' : 'Отметить рабочие дни'}
            </button>
          </div>
        `;
      }

      const renderDay = (ds, label) => {
        const has = state.days[ds] && Object.keys(state.days[ds]).length > 0;
        const working = state.workingDaysMarked[ds];
        const cls = ['cal-day', ds === selected ? 'selected' : '', has ? 'has-data' : '', working ? 'working' : 'non-working'].filter(Boolean).join(' ');
        return `<div class="${cls}" data-date="${ds}">${label}</div>`;
      };

      if (!calExpanded) {
        const sel = new Date(selected + 'T00:00:00');
        const start = new Date(sel);
        start.setDate(sel.getDate() - sel.getDay() + 1);
        html += '<div class="cal-week">';
        for (let i = 0; i < 7; i++) {
          const d = new Date(start);
          d.setDate(start.getDate() + i);
          const ds = d.toISOString().slice(0,10);
          html += renderDay(ds, `${d.getDate()}<br><small>${['Вс','Пн','Вт','Ср','Чт','Пт','Сб'][d.getDay()]}</small>`);
        }
        html += '</div>';
      } else {
        const first = new Date(calViewYear, calViewMonth, 1);
        const last = new Date(calViewYear, calViewMonth + 1, 0);
        const startPad = (first.getDay() + 6) % 7;
        html += '<div class="cal-grid">';
        ['Пн','Вт','Ср','Чт','Пт','Сб','Вс'].forEach(w => html += `<div class="cal-weekday">${w}</div>`);
        for (let i = 0; i < startPad; i++) html += '<div></div>';
        for (let day = 1; day <= last.getDate(); day++) {
          const ds = `${calViewYear}-${String(calViewMonth+1).padStart(2,'0')}-${String(day).padStart(2,'0')}`;
          html += renderDay(ds, day);
        }
        html += '</div>';
      }
      html += '</div>';
      return html;
    }

    function bindCalendar() {
      document.querySelectorAll('.cal-day[data-date]').forEach(el => {
        el.onclick = () => {
          const ds = el.dataset.date;
          if (markMode && calExpanded) {
            state.workingDaysMarked[ds] = !state.workingDaysMarked[ds];
            if (!state.workingDaysMarked[ds]) delete state.workingDaysMarked[ds];
            save();
            render();
          } else {
            state.currentDate = ds;
            const d = new Date(ds);
            calViewMonth = d.getMonth();
            calViewYear = d.getFullYear();
            render();
          }
        };
      });
      const prev = document.getElementById('cal-prev');
      const next = document.getElementById('cal-next');
      const toggle = document.getElementById('cal-toggle');
      if (prev) prev.onclick = () => { calViewMonth--; if (calViewMonth < 0) { calViewMonth = 11; calViewYear--; } render(); };
      if (next) next.onclick = () => { calViewMonth++; if (calViewMonth > 11) { calViewMonth = 0; calViewYear++; } render(); };
      if (toggle) toggle.onclick = () => { calExpanded = !calExpanded; markMode = false; render(); };

      const targetInput = document.getElementById('target-input');
      if (targetInput) {
        targetInput.oninput = () => {
          state.targetMonthly = +targetInput.value || 0;
          save();
          updateHeader();
          updateDayTotalDisplay();
        };
      }
      const markBtn = document.getElementById('mark-mode-btn');
      if (markBtn) markBtn.onclick = () => { markMode = !markMode; render(); };
    }

    function autoSaveDay() {
      const quantities = {};
      document.querySelectorAll('.qty-input').forEach(input => {
        const id = +input.dataset.id;
        const qty = +input.value || 0;
        if (qty > 0) quantities[id] = qty;
      });

      const prev = state.days[state.currentDate] || {};
      Object.entries(quantities).forEach(([id, qty]) => {
        if (qty > 0 && !(prev[id] > 0)) {
          const service = state.services.find(s => s.id == id);
          if (service) service.usage = (service.usage || 0) + 1;
        }
      });
      Object.keys(prev).forEach(id => {
        if (prev[id] > 0 && !(quantities[id] > 0)) {
          const service = state.services.find(s => s.id == id);
          if (service && service.usage > 0) service.usage--;
        }
      });

      state.days[state.currentDate] = quantities;
      save();
      updateHeader();
    }

    function renderToday(app) {
      const services = getSortedServices();
      const day = getDayData(state.currentDate);
      const today = new Date().toISOString().slice(0,10);
      const yesterday = new Date(Date.now() - 86400000).toISOString().slice(0,10);

      let html = `
        <div class="quick-nav">
          <button id="btn-yesterday" class="secondary" style="flex:1">Вчера</button>
          <button id="btn-today" style="flex:1">Сегодня</button>
        </div>
      `;
      html += renderCalendar();

      if (services.length === 0) {
        html += '<div class="empty">Сначала добавьте услуги в Настройках</div>';
      } else {
        html += '<div id="services-list">';
        services.forEach(s => {
          const qty = day[s.id] || 0;
          html += `
            <div class="service-row">
              <div class="service-info">
                <div class="service-name">${s.name}</div>
                <div class="service-price">${s.price.toLocaleString('ru')} ₽ · всего ${s.usage || 0}</div>
              </div>
              <div class="qty-controls">
                <button type="button" class="qty-btn" data-id="${s.id}" data-delta="-1">−</button>
                <input type="number" class="qty-input" data-id="${s.id}" value="${qty}" min="0" inputmode="numeric">
                <button type="button" class="qty-btn" data-id="${s.id}" data-delta="1">+</button>
              </div>
            </div>
          `;
        });
        html += '</div>';
        html += `<textarea id="day-note" placeholder="Заметка к дню" style="margin-top:8px;">${state.notes[state.currentDate] || ''}</textarea>`;
      }
      app.innerHTML = html;

      bindCalendar();

      document.getElementById('btn-today').onclick = () => {
        state.currentDate = today;
        calViewMonth = new Date().getMonth();
        calViewYear = new Date().getFullYear();
        render();
      };
      document.getElementById('btn-yesterday').onclick = () => {
        state.currentDate = yesterday;
        const d = new Date(yesterday);
        calViewMonth = d.getMonth();
        calViewYear = d.getFullYear();
        render();
      };

      document.querySelectorAll('.qty-btn').forEach(btn => {
        btn.onclick = () => {
          const id = btn.dataset.id;
          const delta = +btn.dataset.delta;
          const input = document.querySelector(`.qty-input[data-id="${id}"]`);
          if (input) {
            let v = +input.value || 0;
            v = Math.max(0, v + delta);
            input.value = v;
            updateDayTotalDisplay();
            autoSaveDay();
          }
        };
      });

      document.querySelectorAll('.qty-input').forEach(input => {
        input.oninput = () => {
          updateDayTotalDisplay();
          autoSaveDay();
        };
      });

      const noteEl = document.getElementById('day-note');
      if (noteEl) {
        noteEl.oninput = () => {
          state.notes[state.currentDate] = noteEl.value;
          save();
        };
      }

      updateDayTotalDisplay();
    }

    function updateDayTotalDisplay() {
      const total = calcCurrentDayTotal();
      const net = calcNet(total);
      const dailyTarget = getDailyTarget();
      document.getElementById('day-total').textContent = total.toLocaleString('ru') + ' ₽';
      let pct = '';
      if (dailyTarget > 0) {
        const p = Math.round(net / dailyTarget * 100);
        pct = ` (${p}% от цели дня)`;
      }
      document.getElementById('day-net').textContent = `Твой доход (${state.incomePercent}%): ${net.toLocaleString('ru')} ₽${pct}`;
    }

    function calcCurrentDayTotal() {
      let total = 0;
      document.querySelectorAll('.qty-input').forEach(input => {
        const id = +input.dataset.id;
        const qty = +input.value || 0;
        const service = state.services.find(s => s.id === id);
        if (service) total += qty * service.price;
      });
      return total;
    }

    function renderStats(app) {
      const now = new Date();
      const thisYm = now.toISOString().slice(0,7);
      const prevDate = new Date(now.getFullYear(), now.getMonth() - 1, 1);
      const prevYm = prevDate.toISOString().slice(0,7);

      const thisGross = getMonthGross(thisYm);
      const thisNet = calcNet(thisGross);
      const prevGross = getMonthGross(prevYm);
      const prevNet = calcNet(prevGross);

      const workingDays = Object.keys(state.workingDaysMarked).filter(d => d.startsWith(thisYm) && state.workingDaysMarked[d]);
      const workingWithData = workingDays.filter(d => state.days[d] && Object.keys(state.days[d]).length);
      let sumWorking = 0;
      workingWithData.forEach(d => sumWorking += calcDayTotal(d));
      const avgWorking = workingWithData.length ? Math.round(calcNet(sumWorking) / workingWithData.length) : 0;

      const dates = Object.keys(state.days);
      let totalAll = 0;
      dates.forEach(d => totalAll += calcDayTotal(d));
      const avgAll = dates.length ? Math.round(calcNet(totalAll) / dates.length) : 0;

      const months = {};
      dates.forEach(d => {
        const m = d.slice(0,7);
        months[m] = (months[m] || 0) + calcDayTotal(d);
      });
      const sortedMonths = Object.keys(months).sort().reverse().slice(0,6);

      let html = `
        <div class="grid-2">
          <div class="card stat-card">
            <div class="value">${thisNet.toLocaleString('ru')} ₽</div>
            <div class="label">Твой доход этот месяц</div>
          </div>
          <div class="card stat-card">
            <div class="value">${avgWorking.toLocaleString('ru')} ₽</div>
            <div class="label">Среднее за рабочий день</div>
          </div>
          <div class="card stat-card">
            <div class="value">${prevNet.toLocaleString('ru')} ₽</div>
            <div class="label">Прошлый месяц</div>
          </div>
          <div class="card stat-card">
            <div class="value">${thisNet >= prevNet ? '+' : ''}${(thisNet - prevNet).toLocaleString('ru')} ₽</div>
            <div class="label">Разница с прошлым</div>
          </div>
        </div>

        <h3 style="margin:16px 0 8px;">График по месяцам (твой доход)</h3>
      `;

      const maxMonth = Math.max(...Object.values(months).map(g => calcNet(g)), 1);
      sortedMonths.forEach(m => {
        const net = calcNet(months[m]);
        const pct = Math.round(net / maxMonth * 100);
        const label = new Date(m + '-01').toLocaleDateString('ru-RU', { month: 'short', year: 'numeric' });
        html += `
          <div style="margin-bottom:8px;">
            <div class="small">${label} — ${net.toLocaleString('ru')} ₽</div>
            <div class="chart-bar"><div class="chart-fill" style="width:${pct}%"></div></div>
          </div>
        `;
      });

      html += `<h3 style="margin:16px 0 8px;">Популярность услуг</h3>`;
      const maxUsage = Math.max(...state.services.map(s => s.usage || 0), 1);
      getSortedServices().forEach(s => {
        const pct = Math.round((s.usage || 0) / maxUsage * 100);
        html += `
          <div style="margin-bottom:8px;">
            <div class="small">${s.name} — ${s.usage || 0} раз</div>
            <div class="chart-bar"><div class="chart-fill" style="width:${pct}%"></div></div>
          </div>
        `;
      });

      html += `<h3 style="margin:16px 0 8px;">По месяцам</h3>`;
      sortedMonths.forEach(m => {
        const label = new Date(m + '-01').toLocaleDateString('ru-RU', { month: 'long', year: 'numeric' });
        const gross = months[m];
        const net = calcNet(gross);
        html += `
          <div class="history-item month-item" data-month="${m}">
            <div>${label}</div>
            <div style="text-align:right;">
              <div style="font-weight:700;">${gross.toLocaleString('ru')} ₽</div>
              <div class="small">твой: ${net.toLocaleString('ru')} ₽</div>
            </div>
          </div>
        `;
      });

      html += `<h3 style="margin:16px 0 8px;">История дней</h3>`;
      const sortedDates = Object.keys(state.days).sort().reverse();
      if (sortedDates.length === 0) {
        html += '<div class="empty">Пока пусто</div>';
      } else {
        sortedDates.forEach(date => {
          const total = calcDayTotal(date);
          const net = calcNet(total);
          const d = new Date(date + 'T00:00:00');
          const label = d.toLocaleDateString('ru-RU', { day: 'numeric', month: 'short', year: 'numeric' });
          html += `
            <div class="history-item">
              <div>
                <div>${label}</div>
                <div class="small">${Object.keys(state.days[date]).length} услуг${state.notes[date] ? ' · есть заметка' : ''}</div>
              </div>
              <div style="text-align:right;">
                <div style="font-weight:700; color:var(--success);">${total.toLocaleString('ru')} ₽</div>
                <div class="small">твой: ${net.toLocaleString('ru')} ₽</div>
              </div>
            </div>
          `;
        });
      }

      app.innerHTML = html;

      document.querySelectorAll('.month-item').forEach(item => {
        item.onclick = () => {
          const ym = item.dataset.month;
          const counts = {};
          state.services.forEach(s => counts[s.id] = 0);
          Object.keys(state.days).forEach(date => {
            if (date.startsWith(ym)) {
              Object.entries(state.days[date]).forEach(([id, qty]) => {
                counts[id] = (counts[id] || 0) + qty;
              });
            }
          });
          let detail = `Услуги за ${new Date(ym + '-01').toLocaleDateString('ru-RU', { month: 'long', year: 'numeric' })}:\n\n`;
          let has = false;
          state.services.forEach(s => {
            const qty = counts[s.id] || 0;
            if (qty > 0) { detail += `${s.name}: ${qty} раз\n`; has = true; }
          });
          alert(has ? detail : 'Нет данных');
        };
      });
    }

    function renderSettings(app) {
      const colors = [
        { id: 'teal', name: 'Бирюзовый' },
        { id: 'blue', name: 'Синий' },
        { id: 'purple', name: 'Фиолетовый' },
        { id: 'orange', name: 'Оранжевый' },
        { id: 'rose', name: 'Розовый' },
        { id: 'emerald', name: 'Изумрудный' }
      ];

      let html = `
        <div class="card">
          <label class="small">Тема</label>
          <select id="theme-select">
            <option value="system" ${state.theme==='system'?'selected':''}>Системная</option>
            <option value="light" ${state.theme==='light'?'selected':''}>Светлая</option>
            <option value="dark" ${state.theme==='dark'?'selected':''}>Тёмная</option>
          </select>
          <label class="small" style="margin-top:8px;">Цвет оформления</label>
          <select id="color-select">
            ${colors.map(c => `<option value="${c.id}" ${state.color===c.id?'selected':''}>${c.name}</option>`).join('')}
          </select>
        </div>

        <div class="card">
          <label class="small">Процент твоего дохода от общей суммы</label>
          <input type="number" id="percent-input" value="${state.incomePercent}" min="1" max="100" step="1">
        </div>

        <div class="card">
          <h3 style="margin-bottom:10px;">Услуги</h3>
          <input type="text" id="new-name" placeholder="Название">
          <input type="number" id="new-price" placeholder="Цена ₽" min="0">
          <button id="add-service" style="width:100%;">Добавить услугу</button>
        </div>
        <div id="services-manage">
      `;

      getSortedServices().forEach(s => {
        html += `
          <div class="card" style="display:flex; gap:8px; align-items:center;">
            <input type="text" class="edit-name" data-id="${s.id}" value="${s.name}" style="flex:1; margin:0;">
            <input type="number" class="edit-price" data-id="${s.id}" value="${s.price}" style="width:100px; margin:0;">
            <button class="danger small-btn" data-id="${s.id}">×</button>
          </div>
        `;
      });

      html += `</div>

        <div class="card">
          <h3 style="margin-bottom:10px;">Резервная копия</h3>
          <button id="export-btn" style="width:100%; margin-bottom:8px;">Экспорт в JSON</button>
          <label class="small">Импорт из JSON</label>
          <input type="file" id="import-file" accept=".json" style="padding:8px;">
          <button id="import-btn" style="width:100%; margin-top:8px;" class="secondary">Импортировать</button>
        </div>
      `;

      app.innerHTML = html;

      document.getElementById('theme-select').onchange = (e) => {
        state.theme = e.target.value;
        applyTheme();
        save();
      };
      document.getElementById('color-select').onchange = (e) => {
        state.color = e.target.value;
        applyTheme();
        save();
      };

      document.getElementById('percent-input').oninput = (e) => {
        const v = +e.target.value;
        if (v >= 1 && v <= 100) {
          state.incomePercent = v;
          save();
        }
      };

      document.querySelectorAll('.edit-name, .edit-price').forEach(input => {
        input.oninput = () => {
          const id = +input.dataset.id;
          const service = state.services.find(s => s.id === id);
          if (service) {
            if (input.classList.contains('edit-name')) service.name = input.value.trim() || service.name;
            if (input.classList.contains('edit-price')) service.price = +input.value || 0;
            save();
          }
        };
      });

      document.getElementById('add-service').onclick = () => {
        const name = document.getElementById('new-name').value.trim();
        const price = +document.getElementById('new-price').value;
        if (!name || price <= 0) {
          alert('Название и цена обязательны');
          return;
        }
        state.services.push({ id: nextId(), name, price, usage: 0 });
        save();
        render();
      };

      document.querySelectorAll('.danger').forEach(btn => {
        btn.onclick = () => {
          if (confirm('Удалить услугу?')) {
            const id = +btn.dataset.id;
            state.services = state.services.filter(s => s.id !== id);
            save();
            render();
          }
        };
      });

      document.getElementById('export-btn').onclick = () => {
        const blob = new Blob([JSON.stringify(state, null, 2)], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `dohod-vracha-${new Date().toISOString().slice(0,10)}.json`;
        a.click();
        URL.revokeObjectURL(url);
      };

      document.getElementById('import-btn').onclick = () => {
        const file = document.getElementById('import-file').files[0];
        if (!file) return alert('Выбери файл');
        const reader = new FileReader();
        reader.onload = (e) => {
          try {
            const data = JSON.parse(e.target.result);
            if (data.services && Array.isArray(data.services)) {
              if (confirm('Импорт заменит все данные. Продолжить?')) {
                Object.assign(state, data);
                if (!state.notes) state.notes = {};
                applyTheme();
                save();
                alert('Готово');
                render();
              }
            } else alert('Неверный файл');
          } catch { alert('Ошибка JSON'); }
        };
        reader.readAsText(file);
      };
    }

    document.querySelectorAll('.tab').forEach(tab => {
      tab.onclick = () => {
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        tab.classList.add('active');
        render();
      };
    });

    window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => {
      if (state.theme === 'system') applyTheme();
    });

    load();
    render();

    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js').catch(() => {});
    }
  </script>
</body>
</html>
