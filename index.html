<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Доход Врача</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0d9488">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --accent: #0d9488;
      --accent-light: #14b8a6;
      --text: #f1f5f9;
      --muted: #94a3b8;
      --danger: #ef4444;
      --success: #22c55e;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding-bottom: 80px;
    }
    header {
      background: linear-gradient(135deg, #0d9488, #0f766e);
      padding: 16px 16px 20px;
      position: sticky;
      top: 0;
      z-index: 10;
    }
    header h1 { font-size: 1.4rem; font-weight: 700; }
    .header-info { display: flex; justify-content: space-between; align-items: flex-end; margin-top: 4px; }
    .header-remain { font-size: 0.85rem; opacity: 0.9; text-align: right; }
    .tabs {
      display: flex;
      background: var(--card);
      border-bottom: 1px solid #334155;
      position: sticky;
      top: 72px;
      z-index: 9;
      overflow-x: auto;
    }
    .tab {
      flex: 1;
      min-width: 70px;
      padding: 12px 8px;
      text-align: center;
      font-size: 0.8rem;
      cursor: pointer;
      color: var(--muted);
      border-bottom: 3px solid transparent;
      white-space: nowrap;
    }
    .tab.active {
      color: var(--accent-light);
      border-bottom-color: var(--accent);
      font-weight: 600;
    }
    .content { padding: 16px; }
    .card {
      background: var(--card);
      border-radius: 12px;
      padding: 14px;
      margin-bottom: 12px;
    }
    input, button, select {
      font: inherit;
      border-radius: 8px;
      border: none;
    }
    input[type="number"], input[type="text"], input[type="date"] {
      background: #334155;
      color: var(--text);
      padding: 10px 12px;
      width: 100%;
      margin-bottom: 8px;
    }
    button {
      background: var(--accent);
      color: white;
      padding: 10px 16px;
      cursor: pointer;
      font-weight: 600;
    }
    button:active { transform: scale(0.98); }
    button.secondary { background: #475569; }
    button.danger { background: var(--danger); }
    .service-row {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 10px;
      padding: 10px;
      background: #334155;
      border-radius: 10px;
    }
    .service-info { flex: 1; min-width: 0; }
    .service-name { font-weight: 600; }
    .service-price { color: var(--muted); font-size: 0.85rem; }
    .qty-controls {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .qty-btn {
      width: 36px;
      height: 36px;
      padding: 0;
      font-size: 1.2rem;
      line-height: 1;
      border-radius: 8px;
      background: #475569;
    }
    .qty-input {
      width: 60px !important;
      text-align: center;
      margin: 0 !important;
      padding: 8px 4px !important;
    }
    .total-box {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: #1e293b;
      padding: 10px 16px;
      border-top: 1px solid #334155;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 1rem;
      font-weight: 700;
    }
    .total-box .amount { color: var(--success); }
    .total-box .net { color: var(--accent-light); font-size: 0.9rem; }
    .empty { text-align: center; color: var(--muted); padding: 40px 20px; }
    .history-item {
      display: flex;
      justify-content: space-between;
      padding: 12px 0;
      border-bottom: 1px solid #334155;
    }
    .stat-card {
      text-align: center;
      padding: 16px;
    }
    .stat-card .value { font-size: 1.5rem; font-weight: 700; color: var(--accent-light); }
    .stat-card .label { color: var(--muted); font-size: 0.85rem; }
    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .small { font-size: 0.8rem; color: var(--muted); }
    .cal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }
    .cal-nav { background: #475569; padding: 6px 12px; font-size: 1.1rem; }
    .cal-month { font-weight: 600; }
    .cal-week {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      padding: 4px 0 8px;
      scrollbar-width: thin;
    }
    .cal-day {
      flex: 0 0 48px;
      text-align: center;
      padding: 8px 4px;
      border-radius: 10px;
      background: #334155;
      cursor: pointer;
      font-size: 0.8rem;
    }
    .cal-day.selected { background: var(--accent); color: white; }
    .cal-day.has-data { border: 2px solid var(--success); }
    .cal-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 4px;
      margin-top: 8px;
    }
    .cal-weekday { text-align: center; font-size: 0.75rem; color: var(--muted); padding: 4px 0; }
    .cal-grid .cal-day { flex: none; }
  </style>
</head>
<body>
  <header>
    <h1>💰 Доход Врача</h1>
    <div class="header-info">
      <div class="small" id="today-label"></div>
      <div class="header-remain" id="remain-label"></div>
    </div>
  </header>

  <div class="tabs">
    <div class="tab active" data-tab="today">Сегодня</div>
    <div class="tab" data-tab="stats">Статистика</div>
    <div class="tab" data-tab="settings">Настройки</div>
  </div>

  <div class="content" id="app"></div>

  <div class="total-box" id="total-box" style="display:none;">
    <div>
      <div>Итого: <span class="amount" id="day-total">0 ₽</span></div>
      <div class="net" id="day-net">Твой доход: 0 ₽</div>
    </div>
  </div>

  <script>
    const STORAGE_KEY = 'dohod_vracha_v1';

    let state = {
      services: [],
      days: {},
      currentDate: new Date().toISOString().slice(0, 10),
      incomePercent: 100,
      workingDays: 20,
      targetMonthly: 0
    };

    let calExpanded = false;
    let calViewMonth = new Date().getMonth();
    let calViewYear = new Date().getFullYear();

    function load() {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (raw) {
        try {
          const data = JSON.parse(raw);
          state.services = data.services || [];
          state.days = data.days || {};
          state.incomePercent = data.incomePercent != null ? data.incomePercent : 100;
          state.workingDays = data.workingDays || 20;
          state.targetMonthly = data.targetMonthly || 0;
        } catch (e) {}
      }
      if (state.services.length === 0) {
        state.services = [
          { id: 1, name: 'Консультация', price: 2000, usage: 0 },
          { id: 2, name: 'УЗИ', price: 2500, usage: 0 },
          { id: 3, name: 'Манипуляция', price: 1500, usage: 0 }
        ];
      }
      save();
    }

    function save() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify({
        services: state.services,
        days: state.days,
        incomePercent: state.incomePercent,
        workingDays: state.workingDays,
        targetMonthly: state.targetMonthly
      }));
    }

    function nextId() {
      return state.services.reduce((m, s) => Math.max(m, s.id), 0) + 1;
    }

    function getSortedServices() {
      return [...state.services].sort((a, b) => b.usage - a.usage || a.name.localeCompare(b.name));
    }

    function getDayData(date) {
      return state.days[date] || {};
    }

    function calcDayTotal(date) {
      const day = getDayData(date);
      return state.services.reduce((sum, s) => sum + (day[s.id] || 0) * s.price, 0);
    }

    function calcNet(amount) {
      return Math.round(amount * state.incomePercent / 100);
    }

    function getCurrentMonthNet() {
      const now = new Date();
      const ym = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}`;
      let total = 0;
      Object.keys(state.days).forEach(date => {
        if (date.startsWith(ym)) total += calcDayTotal(date);
      });
      return calcNet(total);
    }

    function updateHeader() {
      const d = new Date(state.currentDate + 'T00:00:00');
      document.getElementById('today-label').textContent = d.toLocaleDateString('ru-RU', { weekday: 'long', day: 'numeric', month: 'long' });

      const currentNet = getCurrentMonthNet();
      const remain = Math.max(0, state.targetMonthly - currentNet);
      const remainEl = document.getElementById('remain-label');
      if (state.targetMonthly > 0) {
        remainEl.textContent = `Осталось: ${remain.toLocaleString('ru')} ₽`;
        remainEl.style.color = remain > 0 ? '#fbbf24' : '#22c55e';
      } else {
        remainEl.textContent = '';
      }
    }

    function render() {
      const tab = document.querySelector('.tab.active').dataset.tab;
      const app = document.getElementById('app');
      document.getElementById('total-box').style.display = tab === 'today' ? 'flex' : 'none';

      if (tab === 'today') renderToday(app);
      else if (tab === 'stats') renderStats(app);
      else if (tab === 'settings') renderSettings(app);

      updateHeader();
    }

    function renderCalendar() {
      const selected = state.currentDate;
      const monthNames = ['Январь','Февраль','Март','Апрель','Май','Июнь','Июль','Август','Сентябрь','Октябрь','Ноябрь','Декабрь'];

      let html = `<div class="card">
        <div class="cal-header">
          <button type="button" class="cal-nav" id="cal-prev">‹</button>
          <div class="cal-month">${monthNames[calViewMonth]} ${calViewYear}</div>
          <button type="button" class="cal-nav" id="cal-next">›</button>
          <button type="button" class="cal-nav secondary" id="cal-toggle" style="margin-left:8px;">${calExpanded ? 'Свернуть' : 'Развернуть'}</button>
        </div>`;

      if (!calExpanded) {
        const sel = new Date(selected + 'T00:00:00');
        const start = new Date(sel);
        start.setDate(sel.getDate() - sel.getDay() + 1);
        html += '<div class="cal-week">';
        for (let i = 0; i < 7; i++) {
          const d = new Date(start);
          d.setDate(start.getDate() + i);
          const ds = d.toISOString().slice(0,10);
          const has = state.days[ds] && Object.keys(state.days[ds]).length > 0;
          const cls = ['cal-day', ds === selected ? 'selected' : '', has ? 'has-data' : ''].filter(Boolean).join(' ');
          html += `<div class="${cls}" data-date="${ds}">${d.getDate()}<br><small>${['Вс','Пн','Вт','Ср','Чт','Пт','Сб'][d.getDay()]}</small></div>`;
        }
        html += '</div>';
      } else {
        const first = new Date(calViewYear, calViewMonth, 1);
        const last = new Date(calViewYear, calViewMonth + 1, 0);
        const startPad = (first.getDay() + 6) % 7;
        html += '<div class="cal-grid">';
        ['Пн','Вт','Ср','Чт','Пт','Сб','Вс'].forEach(w => html += `<div class="cal-weekday">${w}</div>`);
        for (let i = 0; i < startPad; i++) html += '<div></div>';
        for (let day = 1; day <= last.getDate(); day++) {
          const ds = `${calViewYear}-${String(calViewMonth+1).padStart(2,'0')}-${String(day).padStart(2,'0')}`;
          const has = state.days[ds] && Object.keys(state.days[ds]).length > 0;
          const cls = ['cal-day', ds === selected ? 'selected' : '', has ? 'has-data' : ''].filter(Boolean).join(' ');
          html += `<div class="${cls}" data-date="${ds}">${day}</div>`;
        }
        html += '</div>';
      }
      html += '</div>';
      return html;
    }

    function bindCalendar() {
      document.querySelectorAll('.cal-day[data-date]').forEach(el => {
        el.onclick = () => {
          state.currentDate = el.dataset.date;
          const d = new Date(state.currentDate);
          calViewMonth = d.getMonth();
          calViewYear = d.getFullYear();
          render();
        };
      });
      const prev = document.getElementById('cal-prev');
      const next = document.getElementById('cal-next');
      const toggle = document.getElementById('cal-toggle');
      if (prev) prev.onclick = () => { calViewMonth--; if (calViewMonth < 0) { calViewMonth = 11; calViewYear--; } render(); };
      if (next) next.onclick = () => { calViewMonth++; if (calViewMonth > 11) { calViewMonth = 0; calViewYear++; } render(); };
      if (toggle) toggle.onclick = () => { calExpanded = !calExpanded; render(); };
    }

    function autoSaveDay() {
      const quantities = {};
      document.querySelectorAll('.qty-input').forEach(input => {
        const id = +input.dataset.id;
        const qty = +input.value || 0;
        if (qty > 0) quantities[id] = qty;
      });

      const prev = state.days[state.currentDate] || {};
      Object.entries(quantities).forEach(([id, qty]) => {
        if (qty > 0 && !(prev[id] > 0)) {
          const service = state.services.find(s => s.id == id);
          if (service) service.usage = (service.usage || 0) + 1;
        }
      });
      Object.keys(prev).forEach(id => {
        if (prev[id] > 0 && !(quantities[id] > 0)) {
          const service = state.services.find(s => s.id == id);
          if (service && service.usage > 0) service.usage--;
        }
      });

      state.days[state.currentDate] = quantities;
      save();
      updateHeader();
    }

    function renderToday(app) {
      const services = getSortedServices();
      const day = getDayData(state.currentDate);
      let html = renderCalendar();

      if (services.length === 0) {
        html += '<div class="empty">Сначала добавьте услуги в Настройках</div>';
      } else {
        html += '<div id="services-list">';
        services.forEach(s => {
          const qty = day[s.id] || 0;
          html += `
            <div class="service-row">
              <div class="service-info">
                <div class="service-name">${s.name}</div>
                <div class="service-price">${s.price.toLocaleString('ru')} ₽</div>
              </div>
              <div class="qty-controls">
                <button type="button" class="qty-btn" data-id="${s.id}" data-delta="-1">−</button>
                <input type="number" class="qty-input" data-id="${s.id}" value="${qty}" min="0" inputmode="numeric">
                <button type="button" class="qty-btn" data-id="${s.id}" data-delta="1">+</button>
              </div>
            </div>
          `;
        });
        html += '</div>';
      }
      app.innerHTML = html;

      bindCalendar();

      document.querySelectorAll('.qty-btn').forEach(btn => {
        btn.onclick = () => {
          const id = btn.dataset.id;
          const delta = +btn.dataset.delta;
          const input = document.querySelector(`.qty-input[data-id="${id}"]`);
          if (input) {
            let v = +input.value || 0;
            v = Math.max(0, v + delta);
            input.value = v;
            updateDayTotalDisplay();
            autoSaveDay();
          }
        };
      });

      document.querySelectorAll('.qty-input').forEach(input => {
        input.oninput = () => {
          updateDayTotalDisplay();
          autoSaveDay();
        };
      });

      updateDayTotalDisplay();
    }

    function updateDayTotalDisplay() {
      const total = calcCurrentDayTotal();
      const net = calcNet(total);
      document.getElementById('day-total').textContent = total.toLocaleString('ru') + ' ₽';
      document.getElementById('day-net').textContent = `Твой доход (${state.incomePercent}%): ${net.toLocaleString('ru')} ₽`;
    }

    function calcCurrentDayTotal() {
      let total = 0;
      document.querySelectorAll('.qty-input').forEach(input => {
        const id = +input.dataset.id;
        const qty = +input.value || 0;
        const service = state.services.find(s => s.id === id);
        if (service) total += qty * service.price;
      });
      return total;
    }

    function renderStats(app) {
      const dates = Object.keys(state.days);
      let totalAll = 0;
      let maxDay = 0;
      const byMonth = {};
      const currentMonth = new Date().toISOString().slice(0, 7);

      dates.forEach(date => {
        const t = calcDayTotal(date);
        totalAll += t;
        if (t > maxDay) maxDay = t;
        const month = date.slice(0, 7);
        byMonth[month] = (byMonth[month] || 0) + t;
      });

      const avg = dates.length ? Math.round(totalAll / dates.length) : 0;
      const netAll = calcNet(totalAll);
      const netAvg = calcNet(avg);
      const currentMonthTotal = byMonth[currentMonth] || 0;
      const currentMonthNet = calcNet(currentMonthTotal);

      const months = Object.keys(byMonth).sort().reverse().slice(0, 6);

      let html = `
        <div class="grid-2">
          <div class="card stat-card">
            <div class="value">${currentMonthNet.toLocaleString('ru')} ₽</div>
            <div class="label">Твой доход за этот месяц</div>
          </div>
          <div class="card stat-card">
            <div class="value">${netAvg.toLocaleString('ru')} ₽</div>
            <div class="label">Среднее в день (твоё)</div>
          </div>
          <div class="card stat-card">
            <div class="value">${netAll.toLocaleString('ru')} ₽</div>
            <div class="label">Всего твой доход</div>
          </div>
          <div class="card stat-card">
            <div class="value">${dates.length}</div>
            <div class="label">Дней в учёте</div>
          </div>
        </div>

        <h3 style="margin:16px 0 8px;">Популярность услуг</h3>
      `;

      getSortedServices().forEach(s => {
        html += `
          <div class="history-item">
            <div>${s.name}</div>
            <div style="font-weight:700;">${s.usage || 0} раз</div>
          </div>
        `;
      });

      html += `<h3 style="margin:16px 0 8px;">По месяцам (твой доход)</h3>`;

      months.forEach(m => {
        const label = new Date(m + '-01').toLocaleDateString('ru-RU', { month: 'long', year: 'numeric' });
        const net = calcNet(byMonth[m]);
        html += `
          <div class="history-item">
            <div>${label}</div>
            <div style="font-weight:700;">${net.toLocaleString('ru')} ₽</div>
          </div>
        `;
      });

      html += `<h3 style="margin:16px 0 8px;">История дней</h3>`;

      const sortedDates = Object.keys(state.days).sort().reverse();
      if (sortedDates.length === 0) {
        html += '<div class="empty">Пока пусто</div>';
      } else {
        sortedDates.forEach(date => {
          const total = calcDayTotal(date);
          const net = calcNet(total);
          const d = new Date(date + 'T00:00:00');
          const label = d.toLocaleDateString('ru-RU', { day: 'numeric', month: 'short', year: 'numeric' });
          html += `
            <div class="history-item">
              <div>
                <div>${label}</div>
                <div class="small">${Object.keys(state.days[date]).length} услуг</div>
              </div>
              <div style="text-align:right;">
                <div style="font-weight:700; color:var(--success);">${total.toLocaleString('ru')} ₽</div>
                <div class="small">твой: ${net.toLocaleString('ru')} ₽</div>
              </div>
            </div>
          `;
        });
      }

      app.innerHTML = html;
    }

    function renderSettings(app) {
      const targetDaily = state.workingDays > 0 && state.targetMonthly > 0
        ? Math.round(state.targetMonthly / state.workingDays)
        : 0;
      const targetDailyGross = state.incomePercent > 0 && targetDaily > 0
        ? Math.round(targetDaily * 100 / state.incomePercent)
        : 0;

      let html = `
        <div class="card">
          <label class="small">Процент твоего дохода от общей суммы</label>
          <input type="number" id="percent-input" value="${state.incomePercent}" min="1" max="100" step="1">
        </div>
        <div class="card">
          <label class="small">Количество рабочих дней в месяце</label>
          <input type="number" id="days-input" value="${state.workingDays}" min="1" max="31">
        </div>
        <div class="card">
          <label class="small">Необходимый доход в месяц (твой, с учётом %)</label>
          <input type="number" id="target-input" value="${state.targetMonthly}" min="0" step="1000">
        </div>
        <div class="card stat-card" id="target-card">
          <div class="value">${targetDaily.toLocaleString('ru')} ₽</div>
          <div class="label">Целевой доход в день (твой) на следующий месяц</div>
          ${targetDailyGross > 0 ? `<div class="small" style="margin-top:6px;">Нужно зарабатывать ~${targetDailyGross.toLocaleString('ru')} ₽ общей суммы в день</div>` : ''}
        </div>

        <div class="card">
          <h3 style="margin-bottom:10px;">Услуги</h3>
          <input type="text" id="new-name" placeholder="Название">
          <input type="number" id="new-price" placeholder="Цена ₽" min="0">
          <button id="add-service" style="width:100%;">Добавить услугу</button>
        </div>
        <div id="services-manage">
      `;

      getSortedServices().forEach(s => {
        html += `
          <div class="card" style="display:flex; justify-content:space-between; align-items:center;">
            <div>
              <div style="font-weight:600;">${s.name}</div>
              <div class="small">${s.price.toLocaleString('ru')} ₽</div>
            </div>
            <button class="danger small-btn" data-id="${s.id}">Удалить</button>
          </div>
        `;
      });

      html += `</div>

        <div class="card">
          <h3 style="margin-bottom:10px;">Резервная копия</h3>
          <button id="export-btn" style="width:100%; margin-bottom:8px;">Экспорт в JSON</button>
          <label class="small">Импорт из JSON (заменит текущие данные)</label>
          <input type="file" id="import-file" accept=".json" style="padding:8px; background:#334155;">
          <button id="import-btn" style="width:100%; margin-top:8px;" class="secondary">Импортировать</button>
        </div>
      `;

      app.innerHTML = html;

      // Auto-save settings
      ['percent-input','days-input','target-input'].forEach(id => {
        const el = document.getElementById(id);
        if (el) {
          el.oninput = () => {
            const p = +document.getElementById('percent-input').value;
            const d = +document.getElementById('days-input').value;
            const t = +document.getElementById('target-input').value;
            if (p >= 1 && p <= 100) state.incomePercent = p;
            if (d >= 1 && d <= 31) state.workingDays = d;
            if (t >= 0) state.targetMonthly = t;
            save();
            updateHeader();
            const targetDaily = state.workingDays > 0 && state.targetMonthly > 0
              ? Math.round(state.targetMonthly / state.workingDays)
              : 0;
            const targetDailyGross = state.incomePercent > 0 && targetDaily > 0
              ? Math.round(targetDaily * 100 / state.incomePercent)
              : 0;
            const card = document.getElementById('target-card');
            if (card) {
              card.innerHTML = `
                <div class="value">${targetDaily.toLocaleString('ru')} ₽</div>
                <div class="label">Целевой доход в день (твой) на следующий месяц</div>
                ${targetDailyGross > 0 ? `<div class="small" style="margin-top:6px;">Нужно зарабатывать ~${targetDailyGross.toLocaleString('ru')} ₽ общей суммы в день</div>` : ''}
              `;
            }
          };
        }
      });

      document.getElementById('add-service').onclick = () => {
        const name = document.getElementById('new-name').value.trim();
        const price = +document.getElementById('new-price').value;
        if (!name || price <= 0) {
          alert('Название и цена обязательны');
          return;
        }
        state.services.push({ id: nextId(), name, price, usage: 0 });
        save();
        render();
      };

      document.querySelectorAll('.danger').forEach(btn => {
        btn.onclick = () => {
          if (confirm('Удалить услугу? История по ней останется, но в списке пропадёт.')) {
            const id = +btn.dataset.id;
            state.services = state.services.filter(s => s.id !== id);
            save();
            render();
          }
        };
      });

      document.getElementById('export-btn').onclick = () => {
        const data = {
          services: state.services,
          days: state.days,
          incomePercent: state.incomePercent,
          workingDays: state.workingDays,
          targetMonthly: state.targetMonthly,
          exportedAt: new Date().toISOString()
        };
        const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `dohod-vracha-${new Date().toISOString().slice(0,10)}.json`;
        a.click();
        URL.revokeObjectURL(url);
      };

      document.getElementById('import-btn').onclick = () => {
        const file = document.getElementById('import-file').files[0];
        if (!file) {
          alert('Выбери файл JSON');
          return;
        }
        const reader = new FileReader();
        reader.onload = (e) => {
          try {
            const data = JSON.parse(e.target.result);
            if (data.services && Array.isArray(data.services)) {
              if (confirm('Импорт заменит все текущие данные. Продолжить?')) {
                state.services = data.services;
                state.days = data.days || {};
                state.incomePercent = data.incomePercent != null ? data.incomePercent : 100;
                state.workingDays = data.workingDays || 20;
                state.targetMonthly = data.targetMonthly || 0;
                save();
                alert('Данные импортированы');
                render();
              }
            } else {
              alert('Неверный формат файла');
            }
          } catch (err) {
            alert('Ошибка чтения JSON');
          }
        };
        reader.readAsText(file);
      };
    }

    document.querySelectorAll('.tab').forEach(tab => {
      tab.onclick = () => {
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        tab.classList.add('active');
        render();
      };
    });

    load();
    render();

    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js').catch(() => {});
    }
  </script>
</body>
</html>
